<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点货 · Electroluz PV</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #f1f5f9; color: #0f172a; }
        .f-int { font-family: 'Inter', sans-serif; }
        .f-num { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
        .hide-sc::-webkit-scrollbar { display: none; }
        .hide-sc { -ms-overflow-style: none; scrollbar-width: none; }

        .code-pill { display: inline-block; padding: 0.05rem 0.35rem; border-radius: 9999px; border: 1.5px solid #3b82f6; background: white; color: #1e293b; font-size: 0.42rem; font-weight: 700; white-space: nowrap; }
        .fade-in { animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ 顶部统计标签 ============ */
        .stats-banner { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
        .stat-chip {
            flex: 1; min-width: 80px; display: flex; align-items: center; justify-content: center; gap: 0.3rem;
            padding: 0.5rem; border-radius: 0.6rem; font-size: 0.65rem; font-weight: 800;
            cursor: pointer; transition: 0.2s; border: 1.5px solid transparent;
        }
        .stat-chip.active { border-color: currentColor; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-pop { background: #dcfce7; color: #166534; }
        .stat-reg { background: #e0e7ff; color: #3730a3; }
        .stat-baja { background: #e2e8f0; color: #64748b; }
        @media (min-width: 640px) {
            .stat-chip { font-size: 0.85rem; padding: 0.6rem 1rem; }
        }

        /* ============ 视图切换 ============ */
        .view-toggle { display: flex; align-items: center; gap: 0.12rem; }
        .view-toggle button {
            padding: 0.38rem 0.6rem; border-radius: 0.45rem; color: #64748b; cursor: pointer;
            transition: .2s; border: none; background: transparent;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
        }
        .view-toggle button.active { background: #1e293b; color: white; }
        .view-toggle button:not(.active):hover { background: #f1f5f9; }
        @media (min-width: 640px) {
            .view-toggle button { padding: 0.55rem 0.85rem; font-size: 1.05rem; }
        }

        /* ============ 画册网格（CATÁLOGO） ============ */
        .catalog-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0.5rem; }
        @media (min-width: 640px) { .catalog-grid { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0.9rem; } }
        @media (min-width: 1024px) { .catalog-grid { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1rem; } }
        @media (min-width: 1280px) { .catalog-grid { grid-template-columns: repeat(5, minmax(0,1fr)); } }

        .card {
            position: relative; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.85rem;
            overflow: hidden; display: flex; flex-direction: column;
            transition: box-shadow .2s, transform .2s, border-color .2s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,23,42,.10); }
        .card.item-active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.22); }
        .card.card-baja { background: #fbfcfd; }
        .card.card-baja .card-img-wrap { filter: grayscale(.45); }
        .card.card-hidden-item { background: #f9fafb; opacity: 0.75; border-style: dashed; }
        .card.card-hidden-item .card-img-wrap { filter: grayscale(1) brightness(0.9); }

        /* 固定尺寸的图片容器，不裁剪 */
        .card-img-wrap {
            position: relative; width: 100%; height: 130px; background: #f8fafc;
            display: flex; align-items: center; justify-content: center; padding: 0.45rem;
            border-bottom: 1px solid #f1f5f9; flex-shrink: 0;
        }
        @media (min-width: 640px) { .card-img-wrap { height: 170px; } }
        @media (min-width: 1024px) { .card-img-wrap { height: 190px; } }

        .card-img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; transition: transform .2s; }
        .card-img:hover { transform: scale(1.05); }

        .card-check {
            position: absolute; top: 0.35rem; left: 0.35rem; width: 16px; height: 16px;
            accent-color: #3b82f6; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.18);
            border-radius: 4px;
        }
        .rot-badge {
            position: absolute; top: 0.35rem; right: 0.35rem;
            font-size: 0.4rem; font-weight: 800; padding: 0.08rem 0.3rem; border-radius: 9999px;
            letter-spacing: 0.02em; box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .rot-popular { background: #dcfce7; color: #166534; }
        .rot-regular { background: #e0e7ff; color: #3730a3; }
        .rot-baja    { background: #e2e8f0; color: #64748b; }

        /* 隐藏标记 */
        .hidden-badge {
            position: absolute; bottom: 0.35rem; left: 0.35rem;
            font-size: 0.4rem; font-weight: 800; padding: 0.08rem 0.4rem; border-radius: 9999px;
            background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1;
            letter-spacing: 0.02em; box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        @media (min-width: 640px) {
            .hidden-badge { font-size: 0.6rem; padding: 0.12rem 0.6rem; bottom: 0.5rem; left: 0.5rem; }
        }

        .card-body { padding: 0.42rem 0.45rem 0.5rem; display: flex; flex-direction: column; gap: 0.18rem; flex: 1; }
        .card-brand { font-size: 0.44rem; font-weight: 800; color: #475569; letter-spacing: .02em; }
        .card-name {
            font-size: 0.52rem; font-weight: 600; color: #0f172a; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            min-height: 1.3rem;
        }
        .card-emp { font-size: 0.4rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.45rem; margin-top: auto; padding-top: 0.15rem; }
        .card-price { font-weight: 800; color: #0f172a; }
        .baja-hint {
            font-size: 0.36rem; font-weight: 800; color: #b45309; background: #fef3c7;
            border-radius: 0.3rem; padding: 0.1rem 0.25rem; text-align: center; letter-spacing: .01em;
        }
        .nodispo-hint {
            font-size: 0.36rem; font-weight: 800; color: #64748b; background: #e2e8f0;
            border-radius: 0.3rem; padding: 0.1rem 0.25rem; text-align: center; letter-spacing: .01em;
        }

        @media (min-width: 640px) {
            .code-pill { font-size: 0.6rem; padding: 0.08rem 0.5rem; }
            .card-check { width: 20px; height: 20px; top: 0.5rem; left: 0.5rem; }
            .rot-badge { font-size: 0.58rem; padding: 0.12rem 0.5rem; top: 0.5rem; right: 0.5rem; }
            .card-body { padding: 0.6rem 0.65rem 0.7rem; gap: 0.25rem; }
            .card-brand { font-size: 0.65rem; }
            .card-name { font-size: 0.78rem; min-height: 2rem; }
            .card-emp { font-size: 0.6rem; }
            .card-info { font-size: 0.68rem; }
            .baja-hint { font-size: 0.55rem; padding: 0.14rem 0.4rem; }
            .nodispo-hint { font-size: 0.55rem; padding: 0.14rem 0.4rem; }
        }

        /* ============ 表格视图（两列） ============ */
        .tabla-view {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        @media (min-width: 640px) { .tabla-view { gap: 0.9rem; } }

        .tabla-col {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            padding: 0.35rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            box-shadow: 0 1px 3px rgba(15,23,42,.04);
        }
        @media (min-width: 640px) {
            .tabla-col { padding: 0.6rem; gap: 0.55rem; border-radius: 1rem; }
        }

        .tabla-row {
            display: flex; gap: 0.35rem; padding: 0.35rem;
            border: 1px solid #e2e8f0; border-radius: 0.6rem; background: #fff;
            position: relative; align-items: flex-start;
            transition: box-shadow .2s, border-color .2s;
            flex-shrink: 0;
        }
        .tabla-row.item-active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.18); }
        .tabla-row.row-baja { background: #fbfcfd; }
        .tabla-row.row-baja .tabla-thumb { filter: grayscale(.45); }
        .tabla-row.row-hidden { background: #f9fafb; border-style: dashed; opacity: 0.8; }
        .tabla-row.row-hidden .tabla-thumb { filter: grayscale(1) brightness(0.9); }

        .tabla-check {
            width: 14px; height: 14px; accent-color: #3b82f6; flex-shrink: 0;
            margin-top: 0.15rem; cursor: pointer;
        }
        .tabla-thumb {
            width: 50px; height: 50px; object-fit: contain; background: #f8fafc;
            border-radius: 0.45rem; border: 1px solid #e2e8f0; flex-shrink: 0; cursor: zoom-in;
            transition: transform .2s;
        }
        .tabla-thumb:hover { transform: scale(1.05); }
        .tabla-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; }
        .tabla-brand { font-size: 0.45rem; font-weight: 800; color: #475569; }
        .tabla-name {
            font-size: 0.5rem; font-weight: 600; color: #0f172a; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .tabla-emp { font-size: 0.4rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tabla-bottom { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.1rem; }
        .tabla-price { font-weight: 800; font-size: 0.5rem; color: #0f172a; }
        .tabla-rot { font-size: 0.38rem; font-weight: 800; padding: 0.02rem 0.22rem; border-radius: 999px; }

        @media (min-width: 640px) {
            .tabla-check { width: 18px; height: 18px; margin-top: 0.2rem; }
            .tabla-thumb { width: 84px; height: 84px; }
            .tabla-row { gap: 0.6rem; padding: 0.55rem; border-radius: 0.8rem; }
            .tabla-info { gap: 0.18rem; }
            .tabla-brand { font-size: 0.65rem; }
            .tabla-name { font-size: 0.8rem; }
            .tabla-emp { font-size: 0.58rem; }
            .tabla-bottom { gap: 0.4rem; margin-top: 0.15rem; }
            .tabla-price { font-size: 0.75rem; }
            .tabla-rot { font-size: 0.55rem; padding: 0.04rem 0.3rem; }
        }

        /* ============ 数量控制 ============ */
        .qty-wrapper { display: flex; align-items: center; gap: 0.12rem; justify-content: center; margin-top: 0.2rem; }
        .qty-wrapper .qty-btn {
            width: 20px; height: 20px; border-radius: 0.3rem; border: 1px solid #e2e8f0; background: white;
            color: #475569; font-weight: 700; font-size: 0.6rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            touch-action: manipulation; user-select: none;
        }
        .qty-wrapper .qty-btn:active { background: #e2e8f0; transform: scale(0.9); }
        .qty-wrapper .qty-btn:hover { background: #f1f5f9; }
        .qty-wrapper .qty-btn:disabled { opacity: 0.35; pointer-events: none; }
        .qty-wrapper .qty-input-mobile {
            width: 30px; text-align: center; border: 1px solid #e2e8f0; border-radius: 0.3rem;
            padding: 0.05rem 0; font-weight: 700; font-size: 0.58rem; background: white;
        }
        .qty-wrapper .qty-input-mobile:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
        .qty-wrapper .qty-input-mobile:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
        @media (min-width: 640px) {
            .qty-wrapper { margin-top: 0.25rem; }
            .qty-wrapper .qty-btn { width: 28px; height: 28px; font-size: 0.85rem; }
            .qty-wrapper .qty-input-mobile { width: 46px; font-size: 0.85rem; padding: 0.12rem 0; }
        }

        /* ============ 分页 ============ */
        .pagination-bar { display: flex; justify-content: center; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-top: 1rem; }
        .page-btn {
            min-width: 28px; height: 28px; padding: 0 0.4rem; border-radius: 0.4rem;
            background: white; border: 1px solid #e2e8f0; font-size: 0.7rem; font-weight: 700; color: #475569;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .page-btn:hover:not(:disabled) { background: #f1f5f9; }
        .page-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        @media (min-width: 640px) {
            .pagination-bar { gap: 0.5rem; margin-top: 1.5rem; }
            .page-btn { min-width: 34px; height: 34px; font-size: 0.85rem; }
        }

        /* ============ 其他 ============ */
        .search-input { font-size: 0.7rem; padding: 0.4rem 0.6rem; }
        @media (min-width: 640px) { .search-input { font-size: 0.9rem; padding: 0.6rem 0.8rem; } }

        .header-title { font-size: 0.8rem; }
        .header-sub { font-size: 0.45rem; }
        @media (min-width: 640px) {
            .header-title { font-size: 1.1rem; }
            .header-sub { font-size: 0.6rem; }
        }

        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 0.5rem; font-weight: 700; font-size: 0.6rem; display: flex; align-items: center; gap: 0.3rem; transition: 0.2s; }
        .whatsapp-btn:hover { background: #1ebe5c; transform: scale(1.02); }
        @media (min-width: 640px) { .whatsapp-btn { padding: 0.4rem 1.2rem; font-size: 0.8rem; } }

        .stock-badge { font-size: 0.42rem; padding: 0.05rem 0.35rem; border-radius: 9999px; font-weight: 800; }
        @media (min-width: 640px) { .stock-badge { font-size: 0.6rem; padding: 0.08rem 0.5rem; } }
        .stock-zero { background: #fee2e2; color: #991b1b; }
        .stock-low { background: #fef3c7; color: #92400e; }
        .stock-ok { background: #dcfce7; color: #166534; }

        .filter-chip {
            padding: 0.15rem 0.6rem; border-radius: 9999px; font-size: 0.5rem; font-weight: 700;
            background: white; border: 1.5px solid #e2e8f0; color: #475569; cursor: pointer;
            transition: 0.2s; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
        }
        .filter-chip.active { background: #1e293b; border-color: #1e293b; color: white; }
        .filter-chip:hover { background: #f1f5f9; }
        .filter-chip.active:hover { background: #0f172a; }
        @media (min-width: 640px) {
            .filter-chip { font-size: 0.7rem; padding: 0.2rem 1rem; max-width: 250px; }
        }

        /* 隐藏开关按钮 */
        .toggle-hide-btn {
            display: flex; align-items: center; gap: 0.3rem;
            padding: 0.2rem 0.6rem; border-radius: 0.5rem; border: 1.5px solid #e2e8f0;
            background: white; color: #475569; font-weight: 700; font-size: 0.55rem;
            cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .toggle-hide-btn.active { background: #1e293b; border-color: #1e293b; color: white; }
        .toggle-hide-btn:hover { background: #f1f5f9; }
        .toggle-hide-btn.active:hover { background: #0f172a; }
        @media (min-width: 640px) {
            .toggle-hide-btn { font-size: 0.75rem; padding: 0.35rem 0.9rem; }
        }

        /* 抽屉 */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 300; display: none; }
        .drawer-overlay.active { display: block; }
        .drawer-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 290px; max-width: 82vw; background: white; z-index: 350; padding: 1.2rem 1rem; overflow-y: auto; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 4px 0 30px rgba(0,0,0,0.2); }
        .drawer-panel.open { transform: translateX(0); }
        .drawer-panel .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.6rem; }
        .drawer-panel .drawer-header h3 { font-weight: 800; font-size: 1rem; }
        .drawer-panel .drawer-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; }
        .drawer-panel .filter-group { margin-bottom: 1.2rem; }
        .drawer-panel .filter-group label { display: block; font-weight: 700; font-size: 0.65rem; color: #64748b; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .drawer-panel .filter-group .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }

        /* 结算 */
        .checkout-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .checkout-overlay.active { display: flex; }
        .checkout-panel { background: white; border-radius: 1.5rem; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
        .checkout-panel .close-btn { position: sticky; top: 0; float: right; background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 9999px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .checkout-panel .close-btn:hover { background: #e2e8f0; }
        .checkout-item { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.75rem; gap: 0.5rem; }
        .checkout-item .left { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: baseline; }
        .checkout-item .right { font-weight: 800; }
        .checkout-total { margin-top: 1rem; padding-top: 0.8rem; border-top: 2px solid #e2e8f0; display: flex; justify-content: space-between; font-weight: 800; font-size: 1rem; }
        .checkout-empresa { font-size: 0.65rem; color: #64748b; margin-top: 0.6rem; padding: 0.25rem 0.5rem; background: #f1f5f9; border-radius: 0.3rem; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-[#242629] sticky top-0 z-40 shadow-md border-b border-white/5">
        <div class="border-b border-white/5 bg-[#191a1d] px-2 py-0.5 flex justify-between text-[0.45rem] sm:text-[0.6rem] font-bold text-slate-400 f-int">
            <span>RIF J507436055</span>
            <span>Electroluz PV · 点货</span>
        </div>
        <div class="max-w-7xl mx-auto px-2 py-1.5 flex justify-between items-center gap-1">
            <div class="flex items-center gap-1.5 cursor-pointer" onclick="location.reload()">
                <div class="w-7 h-7 sm:w-10 sm:h-10 bg-white rounded-lg flex items-center justify-center p-0.5 shadow-lg"><img src="https://pub-db6d95a9369746c6ae9e956ab6f6ebe7.r2.dev/logo%20pv.png" class="w-full h-full object-cover" alt="logo"></div>
                <div>
                    <h1 class="text-white font-black header-title leading-tight">Electroluz PV</h1>
                    <p class="text-slate-400 header-sub font-black tracking-[0.15em] uppercase mt-0">点货 · CATÁLOGO</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="openDrawer()" class="text-white text-lg sm:text-xl p-1 hover:bg-white/10 rounded-lg transition"><i class="ph-bold ph-list"></i></button>
                <button onclick="openCheckout()" class="bg-amber-500 hover:bg-amber-400 text-white px-2 py-0.5 sm:px-3 sm:py-1 rounded-lg font-bold text-[0.5rem] sm:text-sm flex items-center gap-0.5 transition">
                    <i class="ph-bold ph-shopping-cart text-[0.6rem] sm:text-base"></i> <span class="hidden sm:inline">结算</span>
                    <span id="checkout-badge" class="bg-rose-500 text-white text-[0.4rem] sm:text-[0.6rem] rounded-full px-1.5 py-0.5 ml-0.5">0</span>
                </button>
                <button onclick="sendWhatsApp()" class="whatsapp-btn">
                    <i class="ph-bold ph-whatsapp-logo text-[0.7rem] sm:text-base"></i> <span class="hidden sm:inline">Enviar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- TOAST -->
    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-full text-white font-bold text-[0.6rem] sm:text-sm shadow-2xl z-[500] flex items-center gap-1.5 transition-all duration-300"></div>

    <!-- IMAGE MODAL -->
    <div id="imageModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[100] hidden items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalImage" src="" alt="Producto" class="max-w-[95vw] max-h-[85vh] rounded-2xl shadow-2xl object-contain bg-white p-2" />
    </div>

    <!-- CHECKOUT PANEL -->
    <div id="checkoutOverlay" class="checkout-overlay" onclick="if(event.target===this) closeCheckout()">
        <div class="checkout-panel">

    <script>
        // ========== CONFIG ==========
        const CONFIG = {

        const ROT = { POPULAR: 'Popular', REGULAR: 'Regular', BAJA: 'Baja rotación' };

        const FALLBACK_IMG = "data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'%3e%3crect width='80' height='80' fill='%23f1f5f9'/%3e%3ctext x='40' y='40' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='9' fill='%2394a3b8'%3eSin%3c/text%3e%3c/svg%3e";

        // ========== 本地测试数据（新增 hide 列） ==========
        const TEST_DATA = `Codigo,Descripcion,Almacen_1,Costo,Otro,Detal,Precio1,Grupo,Empresa,Mayor,Rotacion,hide
CAS-14,CALCULADORA CASIO FX-82MS 2ND EDITION,12,16.23,31.65,40.58,34.08,OTROS,"J501459606 INVERSIOS PROVIN CENTER, C.A.",29.50,Popular,

928116,ABRAZADERA DANNI 16MM 1X12U 928116,34,0.43,0.84,1.07,0.9,OTROS,"J505574140 ORIENTE DISTRIBUCION C.A.",0.75,Popular,
928125,ABRAZADERA DANNI 25MM 1X12U 928125,35,0.43,0.84,1.07,0.9,OTROS,"J505574140 ORIENTE DISTRIBUCION C.A.",0.75,Popular,
MG-0054,ABRE VINO,18,2.07,4.04,5.18,4.35,OTROS,"J504750824 LASER LED, C.A.",3.80,Regular,

AKMG6020,ACCESORIOS PARA DRIMER(20UND) PARA (PIEDRA),2,2.34,4.21,4.91,4.21,INGO,"J505572220 BELMENGY, C.A.",3.70,Regular,

AKMG7072,ACCESORIOS PARA DRIMER(73 UND) PARA(PIEZA Y VI),2,3.66,6.59,7.69,6.59,INGO,"J505572220 BELMENGY, C.A.",5.80,Popular,
999HIDE,PRODUCTO OCULTO DE PRUEBA,5,1.00,2.00,3.00,2.50,OTROS,"J505574140 ORIENTE DISTRIBUCION C.A.",2.00,Regular,HIDE`;

        // ========== ESTADO ==========
        let products = [];
        let filtered = [];
        let currentPage = 1;
        let itemsPerPage = 20; // 默认画册 20
        let filterMode = 'all';
        let brandFilter = '';
        let empresaFilter = '';
        let rotationFilter = '';
        let sortMode = 'default';
        let searchTerm = '';
        let counts = {};
        let selectedRows = new Set();
        let empresasSet = new Set();
        let warnedBaja = new Set();
        let viewMode = 'catalog'; // 'catalog' | 'tabla'
        let hideUnavailable = false; // 是否隐藏不可点货的产品

        // ========== UTILIDADES ==========
        function sanitize(str) { if (!str) return ''; const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return str.toString().replace(/[&<>"']/g, m => map[m]); }
        function normalize(str) { return str ? str.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase() : ''; }
        function parseNumber(str) { if (!str) return 0; const cleaned = str.toString().replace(/[$]/g, '').replace(/,/g, '.').trim(); return parseFloat(cleaned) || 0; }
        function cssEsc(v) { return (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/["\\]/g, '\\$&'); }

        function toast(msg, isErr = false) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.innerHTML = `<i class="ph-fill ${isErr ? 'ph-warning-circle' : 'ph-check-circle'}"></i> ${sanitize(msg)}`;
            el.className = `fixed top-6 left-1/2 -translate-x-1/2 px-3 sm:px-6 py-1.5 sm:py-3 rounded-full text-white font-bold text-[0.6rem] sm:text-sm shadow-2xl z-[500] flex items-center gap-1.5 sm:gap-2 transition-all duration-300 ${isErr ? 'bg-amber-500' : 'bg-slate-800'}`;
            clearTimeout(el._t);
            el._t = setTimeout(() => {
                el.classList.add('-translate-y-12', 'opacity-0');
                setTimeout(() => el.className = 'hidden', 300);
            }, 2600);
        }

        // ============ 售卖程度规范化 ============
        function normalizeRotacion(raw) {
            const v = normalize(raw);
            if (!v) return '';
            if (/popular|alta|alto|buena|excelente|rapida|frecuente|top|estrella/.test(v)) return ROT.POPULAR;
            if (/baja|bajo|lenta|poca|nula|poco|muert|estancad|bajo rotacion/.test(v)) return ROT.BAJA;
            if (/regular|media|medio|normal|moderad|estandar/.test(v)) return ROT.REGULAR;
            const n = parseFloat(v);
            if (!isNaN(n)) {
                if (n >= 4) return ROT.POPULAR;
                if (n <= 2) return ROT.BAJA;
                return ROT.REGULAR;
            }
            return ROT.REGULAR;
        }

        // ========== CARGAR DATOS ==========
        async function fetchCSV() {
            try {
                const res = await fetch(CONFIG.CSV_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                if (text.toLowerCase().includes('<html')) throw new Error('无法获取数据');
                parseCSV(text);
                toast('✅ Datos cargados correctamente');
            } catch (e) {
                console.warn('使用本地测试数据:', e.message);
                parseCSV(TEST_DATA);
                toast('⚠️ Usando datos de prueba locales', true);
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) {
                document.getElementById('catalog-grid').innerHTML = '<div class="col-span-full text-center py-8 text-rose-500 font-bold text-sm">CSV vacío</div>';
                return;
            }

            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
            const hNorm = headers.map(h => normalize(h));
            
            const findIdx = (re) => hNorm.findIndex(h => re.test(h));

            const idxCode    = findIdx(/codigo|^id$|cód/);
            const idxName    = findIdx(/descripcion|nombre|producto/);
            const idxStock   = findIdx(/almacen_1|stock|cant|inv/);
            const idxEmpresa = findIdx(/empresa|proveedor|prov|supplier/);
            const idxBrand   = findIdx(/grupo|marca|brand/);
            const idxImage   = findIdx(/images|img|url|imagen|foto/);
            const idxMayor   = findIdx(/mayor|precio_mayor|p_mayor/);
            const idxRot     = findIdx(/rotacion|venta|salida|popular|desempe|rotaci|售卖|程度/);
            const idxHide    = findIdx(/^hide$|hidden|oculto|隐藏/);

            if (idxCode === -1) {
                document.getElementById('catalog-grid').innerHTML = '<div class="col-span-full text-center py-8 text-rose-500 font-bold text-sm">No se encontró columna de código</div>';
                return;
            }

            products = [];
            empresasSet = new Set();

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let row = lines[i];
                while ((row.match(/"/g) || []).length % 2 !== 0 && i < lines.length - 1) row += " " + lines[++i];
                const values = []; let cur = '', inside = false;
                for (let ch of row) {
                    if (ch === '"') inside = !inside;
                    else if (ch === ',' && !inside) { values.push(cur.trim()); cur = ''; }
                    else cur += ch;
                }
                values.push(cur.trim());
                while (values.length < headers.length) values.push('');

                const code = idxCode !== -1 ? values[idxCode] : '';
                if (!code) continue;
                const name = idxName !== -1 ? values[idxName] : 'Sin nombre';
                const stock = idxStock !== -1 ? parseNumber(values[idxStock]) : 0;
                let empresa = idxEmpresa !== -1 ? values[idxEmpresa] : '';
                let brand = idxBrand !== -1 ? values[idxBrand] : '';
                empresa = empresa.replace(/^["\s]+|["\s]+$/g, '').trim();
                brand = brand.replace(/^["\s]+|["\s]+$/g, '').trim().toUpperCase();
                if (!brand && empresa) {
                    const provMatch = empresa.match(/^([A-Z0-9]+)\s/);
                    if (provMatch) brand = provMatch[1];
                }
                const image = idxImage !== -1 ? values[idxImage] : '';
                const mayor = idxMayor !== -1 ? parseNumber(values[idxMayor]) : 0;
                const rotRaw = idxRot !== -1 ? values[idxRot] : '';
                const rotacion = normalizeRotacion(rotRaw);

                // 检测 hide 列
                let hideVal = '';
                if (idxHide !== -1) {
                    hideVal = (values[idxHide] || '').trim().toLowerCase();
                }
                // 只要出现 hide / hidden / oculto / 隐藏 等就视为隐藏
                const isHidden = /^(hide|hidden|oculto|隐藏|1|si|sí|yes|x)$/.test(hideVal) || hideVal === 'hide';

                if (empresa) empresasSet.add(empresa);

                products.push({
                    id: sanitize(code),
                    name: sanitize(name),
                    brand: sanitize(brand),
                    stock: stock,
                    empresa: sanitize(empresa),
                    image: sanitize(image),
                    mayor: mayor,
                    rotacion: rotacion,
                    isHidden: isHidden   // 新增属性
                });
            }

            products.sort((a, b) => a.id.localeCompare(b.id));
            products.forEach(p => { counts[p.id] = 0; });

            // 更新顶部统计数量
            updateStats();

            renderDrawerEmpresaChips();
            filtered = [...products];
            applyFiltersAndSort();
            renderView();
            updateCheckoutBadge();
        }

        function updateStats() {
            const pop = products.filter(p => p.rotacion === ROT.POPULAR).length;
            const reg = products.filter(p => p.rotacion === ROT.REGULAR).length;
            const baja = products.filter(p => p.rotacion === ROT.BAJA).length;
            document.getElementById('count-pop').textContent = pop;
            document.getElementById('count-reg').textContent = reg;
            document.getElementById('count-baja').textContent = baja;
        }

        function renderDrawerEmpresaChips() {
            const container = document.getElementById('drawer-empresa-chips');
            if (!container) return;
            container.innerHTML = `<button class="filter-chip active" data-empresa="" onclick="setEmpresaFilter('')">Todos</button>`;
            if (empresasSet.size === 0) {
                container.innerHTML += '<span class="text-[0.5rem] text-slate-400">No hay empresas</span>';
                return;
            }
            Array.from(empresasSet).sort().forEach(emp => {
                const short = emp.length > 25 ? emp.substring(0, 22) + '…' : emp;
                const btn = document.createElement('button');
                btn.className = 'filter-chip';
                btn.dataset.empresa = emp;
                btn.textContent = short;
                btn.title = emp;
                btn.onclick = function () { setEmpresaFilter(emp); };
                container.appendChild(btn);
            });
        }

        // ========== FILTROS Y ORDEN ==========
        function applyFiltersAndSort() {
            let data = [...products];

            // 新增：是否隐藏不可点货产品
            if (hideUnavailable) {
                data = data.filter(p => !p.isHidden);
            }

            if (searchTerm.trim() !== '') {
                const term = normalize(searchTerm);
                data = data.filter(p =>
                    normalize(p.id).includes(term) ||
                    normalize(p.name).includes(term) ||
                    normalize(p.brand).includes(term) ||
                    normalize(p.empresa).includes(term)
                );
            }
            if (filterMode === 'zero') data = data.filter(p => p.stock === 0);
            else if (filterMode === 'low') data = data.filter(p => p.stock <= 5 && p.stock > 0);
            if (brandFilter) data = data.filter(p => p.brand === brandFilter);
            if (empresaFilter) data = data.filter(p => p.empresa === empresaFilter);
            if (rotationFilter) data = data.filter(p => p.rotacion === rotationFilter);

            if (sortMode === 'qty-asc') data.sort((a, b) => a.stock - b.stock);
            else if (sortMode === 'qty-desc') data.sort((a, b) => b.stock - a.stock);
            else data.sort((a, b) => a.id.localeCompare(b.id));

            filtered = data;
        }

        function applySearchMain() {
            searchTerm = document.getElementById('mainSearchInput').value;
            currentPage = 1;
            applyFiltersAndSort();
            renderView();
        }

        function setFilter(mode) {
            filterMode = mode;
            document.querySelectorAll('.filter-chip[data-filter]').forEach(el => el.classList.toggle('active', el.dataset.filter === mode));
            currentPage = 1; applyFiltersAndSort(); renderView();
        }
        function setBrandFilter(brand) {
            brandFilter = brand;
            document.querySelectorAll('.filter-chip[data-brand]').forEach(el => el.classList.toggle('active', el.dataset.brand === brand));
            currentPage = 1; applyFiltersAndSort(); renderView();
        }
        function setEmpresaFilter(empresa) {
            empresaFilter = empresa;
            document.querySelectorAll('.filter-chip[data-empresa]').forEach(el => el.classList.toggle('active', el.dataset.empresa === empresa));
            currentPage = 1; applyFiltersAndSort(); renderView();
        }
        function setRotFilter(rot) {
            rotationFilter = rot;
            document.querySelectorAll('.filter-chip[data-rot]').forEach(el => el.classList.toggle('active', el.dataset.rot === rot));
            currentPage = 1; applyFiltersAndSort(); renderView();
            
            // 同步顶部统计标签的高亮
            ['Popular', 'Regular', 'Baja rotación'].forEach(r => {
                const id = r === 'Popular' ? 'chip-pop' : r === 'Regular' ? 'chip-reg' : 'chip-baja';
                document.getElementById(id).classList.toggle('active', r === rot);
            });

            if (rot === ROT.BAJA) toast('💤 Mostrando productos de baja rotación — no necesitan点货');
        }

        function toggleStatFilter(rot) {
            if (rotationFilter === rot) {
                setRotFilter('');
            } else {
                setRotFilter(rot);
            }
        }

        function setSort(mode) {
            sortMode = mode;
            document.querySelectorAll('.filter-chip[data-sort]').forEach(el => el.classList.toggle('active', el.dataset.sort === mode));
            currentPage = 1; applyFiltersAndSort(); renderView();
        }

        // ========== 新增：一键隐藏不可点货 ==========
        function toggleHideUnavailable() {
            hideUnavailable = !hideUnavailable;
            const btn = document.getElementById('hideUnavailableBtn');
            btn.classList.toggle('active', hideUnavailable);
            btn.innerHTML = hideUnavailable
                ? '<i class="ph-bold ph-eye"></i> <span class="hidden xs:inline">显示全部</span>'
                : '<i class="ph-bold ph-eye-slash"></i> <span class="hidden xs:inline">隐藏No disponible</span>';
            currentPage = 1;
            applyFiltersAndSort();
            renderView();
            toast(hideUnavailable ? '🙈 Productos no disponibles ocultos' : '👁️ Mostrando todos los productos');
        }

        // ========== 视图切换 ==========
        function setView(mode) {
            if (viewMode === mode) return;
            viewMode = mode;
            
            if (mode === 'tabla') {
                itemsPerPage = 10;
            } else {
                itemsPerPage = 20;
            }
            currentPage = 1;

            document.querySelectorAll('.view-toggle button').forEach(b => {
                b.classList.toggle('active', b.dataset.view === mode);
            });
            
            renderView();
        }

        function renderView() {
            const noRes = document.getElementById('no-results');
            const viewCatalog = document.getElementById('view-catalog');
            const viewTabla = document.getElementById('view-tabla');
            const pagBar = document.getElementById('pagination-bar');

            if (products.length === 0) {
                viewCatalog.classList.remove('hidden');
                viewTabla.classList.add('hidden');
                noRes.classList.add('hidden');
                pagBar.classList.add('hidden');
                document.getElementById('catalog-grid').innerHTML = '<div class="col-span-full text-center py-8 text-slate-400 text-sm">Cargando productos...</div>';
                return;
            }

            if (filtered.length === 0) {
                noRes.classList.remove('hidden');
                viewCatalog.classList.add('hidden');
                viewTabla.classList.add('hidden');
                pagBar.classList.add('hidden');
                return;
            }

            noRes.classList.add('hidden');
            pagBar.classList.remove('hidden');

            const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;

            if (viewMode === 'catalog') {
                viewCatalog.classList.remove('hidden');
                viewTabla.classList.add('hidden');
                renderCatalog(totalPages);
            } else {
                viewCatalog.classList.add('hidden');
                viewTabla.classList.remove('hidden');
                renderTabla(totalPages);
            }

            renderPagination(totalPages);
        }

        // ========== RENDER 画册 ==========
        function cardHTML(p) {
            const qty = counts[p.id] || 0;
            const checked = selectedRows.has(p.id) ? 'checked' : '';
            const imgSrc = p.image && p.image.trim() !== '' ? p.image : FALLBACK_IMG;
            const isBaja = p.rotacion === ROT.BAJA;
            const isHidden = p.isHidden;
            const disabled = isHidden;

            let stockBadge;
            if (p.stock === 0) stockBadge = '<span class="stock-badge stock-zero">0</span>';
            else if (p.stock <= 5) stockBadge = `<span class="stock-badge stock-low">${p.stock}</span>`;
            else stockBadge = `<span class="stock-badge stock-ok">${p.stock}</span>`;

            let rotBadge = '';
            if (p.rotacion === ROT.POPULAR) rotBadge = '<span class="rot-badge rot-popular">🔥 Popular</span>';
            else if (p.rotacion === ROT.REGULAR) rotBadge = '<span class="rot-badge rot-regular">Regular</span>';
            else if (isBaja) rotBadge = '<span class="rot-badge rot-baja">💤 Baja</span>';

            const mayorDisplay = p.mayor > 0 ? `$${p.mayor.toFixed(2)}` : '—';
            const empShort = p.empresa ? (p.empresa.length > 24 ? p.empresa.substring(0, 22) + '…' : p.empresa) : '';

            // 隐藏标记
            const hiddenBadge = isHidden ? '<span class="hidden-badge">🚫 No disponible</span>' : '';

            // 禁用点货的提示
            const noDispoHint = isHidden ? '<div class="nodispo-hint">🚫 No disponible · 不可点货</div>' : '';

            // 数量控制是否禁用
            const qtyDisabled = disabled ? 'disabled' : '';
            const qtyDisabledAttr = disabled ? 'disabled' : '';

            return `
            <div class="card item-row ${isBaja ? 'card-baja' : ''} ${isHidden ? 'card-hidden-item' : ''} ${qty > 0 ? 'item-active' : ''}" data-id="${p.id}">
                <div class="card-img-wrap">
                    <img src="${imgSrc}" class="card-img" alt="${p.name}" loading="lazy"
                         onclick="openImageModal(this.src)"
                         onerror="this.onerror=null;this.src='${FALLBACK_IMG}'" />
                    <input type="checkbox" class="card-check row-check" data-id="${p.id}" ${checked} onchange="toggleRow('${p.id}')" ${qtyDisabledAttr} />
                    ${rotBadge}
                    ${hiddenBadge}
                </div>
                <div class="card-body">
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="code-pill">${p.id}</span>
                        <span class="card-brand">${p.brand || '—'}</span>
                    </div>
                    <div class="card-name" title="${p.name}">${p.name}</div>
                    <div class="card-emp" title="${p.empresa}">${empShort || '—'}</div>
                    <div class="card-info">
                        <span class="card-stock">Stock ${stockBadge}</span>
                        <span class="card-price f-num">${mayorDisplay}</span>
                    </div>
                    ${isBaja && !isHidden ? '<div class="baja-hint">💤 No requiere点货</div>' : ''}
                    ${noDispoHint}
                    <div class="qty-wrapper">
                        <button class="qty-btn" onclick="adjustCount('${p.id}', -1)" type="button" ${qtyDisabledAttr}>−</button>
                        <input type="number" class="qty-input-mobile" id="count_${p.id}" value="${qty}" min="0"
                            oninput="updateCount('${p.id}', this.value)"
                            onchange="updateCount('${p.id}', this.value)"
                            onfocus="this.select()" inputmode="numeric" pattern="[0-9]*" ${qtyDisabledAttr} />
                        <button class="qty-btn" onclick="adjustCount('${p.id}', 1)" type="button" ${qtyDisabledAttr}>+</button>
                    </div>
                </div>
            </div>`;
        }

        function renderCatalog(totalPages) {
            const grid = document.getElementById('catalog-grid');
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);
            grid.innerHTML = pageItems.map(cardHTML).join('');
            
            updateCheckoutBadge();
            updateSelectedCount();
        }

        // ========== RENDER 表格（双列） ==========
        function tablaRowHTML(p) {
            const qty = counts[p.id] || 0;
            const checked = selectedRows.has(p.id) ? 'checked' : '';
            const imgSrc = p.image && p.image.trim() !== '' ? p.image : FALLBACK_IMG;
            const isBaja = p.rotacion === ROT.BAJA;
            const isHidden = p.isHidden;
            const disabled = isHidden;

            let stockBadge;
            if (p.stock === 0) stockBadge = '<span class="stock-badge stock-zero">0</span>';
            else if (p.stock <= 5) stockBadge = `<span class="stock-badge stock-low">${p.stock}</span>`;
            else stockBadge = `<span class="stock-badge stock-ok">${p.stock}</span>`;

            let rotTag = '';
            if (p.rotacion === ROT.POPULAR) rotTag = '<span class="tabla-rot rot-popular">🔥</span>';
            else if (p.rotacion === ROT.REGULAR) rotTag = '<span class="tabla-rot rot-regular">R</span>';
            else if (isBaja) rotTag = '<span class="tabla-rot rot-baja">💤</span>';

            const mayorDisplay = p.mayor > 0 ? `$${p.mayor.toFixed(2)}` : '—';

            // 禁用
            const qtyDisabledAttr = disabled ? 'disabled' : '';

            // 隐藏标记
            const hiddenTag = isHidden ? '<span class="text-[0.4rem] sm:text-[0.55rem] font-bold text-slate-400 ml-1">🚫 No disponible</span>' : '';

            return `
            <div class="tabla-row item-row ${qty > 0 ? 'item-active' : ''} ${isBaja ? 'row-baja' : ''} ${isHidden ? 'row-hidden' : ''}" data-id="${p.id}">
                <input type="checkbox" class="tabla-check row-check" data-id="${p.id}" ${checked} onchange="toggleRow('${p.id}')" ${qtyDisabledAttr} />
                <img src="${imgSrc}" class="tabla-thumb" alt="${p.name}" loading="lazy"
                     onclick="openImageModal(this.src)"
                     onerror="this.onerror=null;this.src='${FALLBACK_IMG}'" />
                <div class="tabla-info">
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="code-pill">${p.id}</span>
                        <span class="tabla-brand">${p.brand || '—'}</span>
                        ${rotTag}
                        ${hiddenTag}
                    </div>
                    <div class="tabla-name" title="${p.name}">${p.name}</div>
                    <div class="tabla-emp" title="${p.empresa}">${p.empresa || '—'}</div>
                    <div class="tabla-bottom">
                        <span>${stockBadge}</span>
                        <span class="tabla-price f-num">${mayorDisplay}</span>
                        <div class="qty-wrapper">
                            <button class="qty-btn" onclick="adjustCount('${p.id}', -1)" type="button" ${qtyDisabledAttr}>−</button>
                            <input type="number" class="qty-input-mobile" id="count_${p.id}" value="${qty}" min="0"
                                oninput="updateCount('${p.id}', this.value)"
                                onchange="updateCount('${p.id}', this.value)"
                                onfocus="this.select()" inputmode="numeric" pattern="[0-9]*" ${qtyDisabledAttr} />
                            <button class="qty-btn" onclick="adjustCount('${p.id}', 1)" type="button" ${qtyDisabledAttr}>+</button>
                        </div>
                    </div>
                    ${isBaja && !isHidden ? '<div class="baja-hint">💤 No requiere点货</div>' : ''}
                    ${isHidden ? '<div class="nodispo-hint">🚫 No disponible · 不可点货</div>' : ''}
                </div>
            </div>`;
        }

        function renderTabla(totalPages) {
            const leftEl = document.getElementById('tabla-col-left');
            const rightEl = document.getElementById('tabla-col-right');
            
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filtered.slice(start, start + itemsPerPage);
            
            const leftItems = pageItems.slice(0, 5);
            const rightItems = pageItems.slice(5, 10);
            
            const emptyMsg = '<div class="text-center text-slate-400 text-[0.6rem] sm:text-sm py-6">Sin productos</div>';
            
            leftEl.innerHTML = leftItems.length ? leftItems.map(tablaRowHTML).join('') : emptyMsg;
            rightEl.innerHTML = rightItems.length ? rightItems.map(tablaRowHTML).join('') : emptyMsg;
            
            updateCheckoutBadge();
            updateSelectedCount();
        }

        // ========== 统一分页器 ==========
        function renderPagination(totalPages) {
            const bar = document.getElementById('pagination-bar');
            if (totalPages <= 1) {
                bar.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}><i class="ph-bold ph-caret-left"></i></button>`;
            
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" onclick="jumpPage(1)">1</button>`;
                if (startPage > 2) html += `<span class="text-slate-400 text-xs">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="jumpPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="text-slate-400 text-xs">...</span>`;
                html += `<button class="page-btn" onclick="jumpPage(${totalPages})">${totalPages}</button>`;
            }

            html += `<button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}><i class="ph-bold ph-caret-right"></i></button>`;

            bar.innerHTML = html;
        }

        function jumpPage(page) {
            currentPage = page;
            renderView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(delta) {
            const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
            const newPage = currentPage + delta;
            if (newPage < 1 || newPage > totalPages) return;
            jumpPage(newPage);
        }

        // ========== 点货操作 ==========
        function adjustCount(id, delta) {
            const product = products.find(p => p.id === id);
            if (product && product.isHidden) {
                toast('🚫 Producto no disponible — no se puede点货', true);
                return;
            }
            const cur = counts[id] || 0;
            const val = Math.max(0, cur + delta);
            counts[id] = val;
            const input = document.getElementById(`count_${id}`);
            if (input) input.value = val;
            updateCheckoutBadge();
            handleCountChange(id, cur, val);
        }

        function updateCount(id, raw) {
            const product = products.find(p => p.id === id);
            if (product && product.isHidden) {
                const input = document.getElementById(`count_${id}`);
                if (input) input.value = counts[id] || 0;
                toast('🚫 Producto no disponible — no se puede点货', true);
                return;
            }
            let num = parseInt(raw, 10);
            if (isNaN(num) || num < 0) num = 0;
            const prev = counts[id] || 0;
            counts[id] = num;
            updateCheckoutBadge();
            handleCountChange(id, prev, num);
        }

        function handleCountChange(id, prev, val) {
            const row = document.querySelector(`.item-row[data-id="${cssEsc(id)}"]`);
            if (row) row.classList.toggle('item-active', val > 0);

            if (val > 0 && val > prev && !warnedBaja.has(id)) {
                const p = products.find(x => x.id === id);
                if (p && p.rotacion === ROT.BAJA) {
                    warnedBaja.add(id);
                    toast('💤 Producto de BAJA ROTACIÓN — no necesita点货', true);
                }
            }
        }

        // ========== MULTI-SELECT ==========
        function toggleRow(id) {
            const product = products.find(p => p.id === id);
            if (product && product.isHidden) {
                toast('🚫 No se puede seleccionar un producto no disponible', true);
                return;
            }
            if (selectedRows.has(id)) selectedRows.delete(id);
            else selectedRows.add(id);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            // 仅占位，维持结构
        }

        // ========== CHECKOUT ==========
        function updateCheckoutBadge() {
            const total = Object.values(counts).reduce((sum, v) => sum + v, 0);
            document.getElementById('checkout-badge').textContent = total;
        }

        function openCheckout() {
            const overlay = document.getElementById('checkoutOverlay');
            const list = document.getElementById('checkoutList');
            const totalEl = document.getElementById('checkoutTotal');
            const totalQty = document.getElementById('checkoutTotalQty');

            const items = products.filter(p => (counts[p.id] || 0) > 0);
            if (items.length === 0) {
                list.innerHTML = '<div class="text-slate-400 text-center py-4">No hay productos点货</div>';
                totalEl.classList.add('hidden');
                overlay.classList.add('active');
                return;
            }

            const grouped = {};
            items.forEach(p => {
                const key = p.empresa || 'Sin Empresa';
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(p);
            });

            let html = '';
            let total = 0;
            for (const [emp, prods] of Object.entries(grouped)) {
                html += `<div class="checkout-empresa font-bold">🏢 ${emp}</div>`;
                prods.forEach(p => {
                    const qty = counts[p.id] || 0;
                    total += qty;
                    const bajaTag = p.rotacion === ROT.BAJA ? '<span class="text-amber-600 text-[0.6rem] font-bold">💤 baja rot.</span>' : '';
                    html += `
                        <div class="checkout-item">
                            <div class="left">
                                <span class="font-bold">${p.id}</span>
                                <span>${p.name}</span>
                                <span class="text-slate-400 text-[0.6rem]">${p.brand || ''}</span>
                                ${bajaTag}
                            </div>
                            <div class="right">${qty}</div>
                        </div>
                    `;
                });
            }
            list.innerHTML = html;
            totalQty.textContent = total;
            totalEl.classList.remove('hidden');
            overlay.classList.add('active');
        }

        function closeCheckout() { document.getElementById('checkoutOverlay').classList.remove('active'); }

        function clearAllCounts() {
            if (!confirm('¿Vaciar todos los conteos?')) return;
            products.forEach(p => {
                counts[p.id] = 0;
                const input = document.getElementById(`count_${p.id}`);
                if (input) input.value = 0;
            });
            document.querySelectorAll('.item-active').forEach(c => c.classList.remove('item-active'));
            warnedBaja.clear();
            updateCheckoutBadge();
            closeCheckout();
            toast('Conteos vaciados');
        }

        // ========== DRAWER ==========
        function openDrawer() {
            document.getElementById('drawerOverlay').classList.add('active');
            document.getElementById('drawerPanel').classList.add('open');
        }
        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('active');
            document.getElementById('drawerPanel').classList.remove('open');
        }

        // ========== IMAGEN ==========
        function openImageModal(src) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = src;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ========== WHATSAPP ==========
        function sendWhatsApp() {
            const items = products.filter(p => (counts[p.id] || 0) > 0);
            if (items.length === 0) { toast('No hay productos点货', true); return; }

            let msg = '📋 *Nuevo Pedido - Electroluz PV*\n';
            msg += `📅 ${new Date().toLocaleString('es-ES')}\n`;
            msg += `───────────────────\n\n`;

            const grouped = {};
            items.forEach(p => {
                const key = p.empresa || 'Sin Empresa';
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(p);
            });

            let idx = 1;
            for (const [emp, prods] of Object.entries(grouped)) {
                msg += `🏢 *EMPRESA: ${emp}*\n`;
                msg += `───────────────────\n`;
                prods.forEach(p => {
                    const qty = counts[p.id] || 0;
                    msg += `${idx}. *${p.id}* - ${p.name}\n`;
                    msg += `   Cantidad UND: ${qty}\n`;
                    if (p.brand) msg += `   Marca: ${p.brand}\n`;
                    msg += `\n`;
                    idx++;
                });
                msg += `───────────────────\n\n`;
            }

            const totalQty = items.reduce((sum, i) => sum + (counts[i.id] || 0), 0);
            msg += `Total productos: ${items.length}\n`;
            msg += `Total unidades: ${totalQty}\n`;
            msg += `───────────────────\n`;
            msg += `Pedido Nuevo Electroluz PV`;

            window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
            toast('📤 Abriendo WhatsApp...');
            closeCheckout();
        }

        // ========== INICIO ==========
        window.onload = function () { fetchCSV(); };
    </script>
</body>
</html>
