<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Móvil Verificador BDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700">
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 text-center">
            <h1 class="text-2xl font-bold tracking-wide flex items-center justify-center gap-2">
                <i class="fa-solid fa-mobile-screen-button"></i> Verificador Pago Móvil BDV
            </h1>
            <p class="text-emerald-100 text-sm mt-1">Conciliación de pagos (API oficial)</p>
        </div>

        <!-- Form -->
        <form id="verifyForm" class="p-6 space-y-4">
            <!-- Cédula Pagador -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Cédula del Pagador</label>
                <div class="flex gap-2">
                    <select id="cedulaTipo" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="V">V</option>
                        <option value="E">E</option>
                        <option value="J">J</option>
                        <option value="G">G</option>
                    </select>
                    <input type="text" id="cedulaNum" required placeholder="27037606" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- Teléfono Pagador -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Teléfono del Pagador (Origen)</label>
                <div class="flex gap-2">
                    <select id="operadorPagador" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="0412">0412</option>
                        <option value="0414">0414</option>
                        <option value="0424">0424</option>
                        <option value="0416">0416</option>
                        <option value="0426">0426</option>
                    </select>
                    <input type="text" id="telefonoPagador" required maxlength="7" placeholder="1234567" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- Teléfono Destino (Receptor) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Teléfono del Receptor (Destino)</label>
                <div class="flex gap-2">
                    <select id="operadorDestino" class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="0412">0412</option>
                        <option value="0414">0414</option>
                        <option value="0424">0424</option>
                        <option value="0416">0416</option>
                        <option value="0426">0426</option>
                    </select>
                    <input type="text" id="telefonoDestino" required maxlength="7" placeholder="1234567" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- Referencia completa -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Referencia del Pago (completa)</label>
                <input type="text" id="referencia" required placeholder="Ej: 123112313" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <!-- Fecha de Pago -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Fecha del Pago</label>
                <input type="date" id="fechaPago" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <!-- Monto -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Monto (Bolívares)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-bold">Bs.</span>
                    <input type="text" id="montoInput" required placeholder="0,00" class="w-full bg-slate-700 border border-slate-600 rounded-lg pl-12 pr-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono">
                </div>
                <p class="text-xs text-slate-400 mt-1">Ej: 3.919,79 (se enviará como 3919.79)</p>
            </div>

            <!-- Banco Origen -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Banco Origen</label>
                <select id="bancoOrigen" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="0102">Banco de Venezuela (0102)</option>
                    <option value="0104">Venezolano de Crédito (0104)</option>
                    <option value="0105">Mercantil (0105)</option>
                    <option value="0108">Provincial (0108)</option>
                    <option value="0114">Bancaribe (0114)</option>
                    <option value="0115">Banco Exterior (0115)</option>
                    <option value="0116">Banco Occidental de Descuento (0116)</option>
                    <option value="0128">Banco Caroní (0128)</option>
                    <option value="0134">Banesco (0134)</option>
                    <option value="0137">Banco Sofitasa (0137)</option>
                    <option value="0138">Banco Plaza (0138)</option>
                    <option value="0146">Banco del Tesoro (0146)</option>
                    <option value="0151">Banco Fondo Común (0151)</option>
                    <option value="0156">100% Banco (0156)</option>
                    <option value="0157">Banco Del Sur (0157)</option>
                    <option value="0163">Banco Agrícola de Venezuela (0163)</option>
                    <option value="0166">Banco Bicentenario (0166)</option>
                    <option value="0168">Banco de la Nación (0168)</option>
                    <option value="0171">Banco Activo (0171)</option>
                    <option value="0172">Bancamiga (0172)</option>
                    <option value="0173">Banco Internacional de Desarrollo (0173)</option>
                    <option value="0174">Banplus (0174)</option>
                    <option value="0177">Banco de la Fuerza Armada (0177)</option>
                    <option value="0190">Caja de Ahorros Militar (0190)</option>
                </select>
            </div>

            <button type="submit" id="btnVerificar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Verificar Pago
            </button>
        </form>

        <!-- Result Container -->
        <div id="resultContainer" class="hidden p-6 border-t border-slate-700 text-center space-y-4 animate-pop">
            <div class="p-4 rounded-xl border flex flex-col items-center shadow-inner" id="resultCardBox">
                <div id="resultIcon" class="text-5xl mb-2"></div>
                <h3 id="resultTitle" class="text-xl font-extrabold tracking-wide"></h3>
                <p id="resultMessage" class="text-sm mt-2 leading-relaxed"></p>
            </div>
            <button type="button" id="btnReset" onclick="resetForm()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3 rounded-lg transition duration-200 border border-slate-600 flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-rotate-right"></i> Probar otro pago
            </button>
        </div>

        <div class="bg-slate-900/50 p-4 text-center text-xs text-slate-500 border-t border-slate-800">
            Conexión segura vía Cloudflare Worker • API BDV Conciliación
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center">
        <div class="bg-slate-800 p-6 rounded-xl flex flex-col items-center border border-slate-700 shadow-2xl">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500 mb-3"></div>
            <p class="text-sm text-slate-300">Consultando con el banco...</p>
        </div>
    </div>

    <script>
        // ============= CONFIGURACIÓN =============
        // Reemplaza con la URL de tu Cloudflare Worker
        const API_ENDPOINT = "https://bdvpagomovil.electroluzpv.workers.dev"; 

        // ============= FORMATEO DE MONTO =============
        const montoInput = document.getElementById('montoInput');
        montoInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (!value) {
                e.target.value = '';
                return;
            }
            let number = parseInt(value, 10) / 100;
            e.target.value = number.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        });

        // ============= FECHA POR DEFECTO =============
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fechaPago').value = today;
        });

        // ============= CACHE DIARIO (opcional) =============
        function getDailyCache() {
            const today = new Date().toISOString().split('T')[0];
            const storedDate = localStorage.getItem('pm_cache_date');
            let cache = JSON.parse(localStorage.getItem('pm_cache_records') || '[]');
            if (storedDate !== today) {
                localStorage.setItem('pm_cache_date', today);
                localStorage.setItem('pm_cache_records', JSON.stringify([]));
                return [];
            }
            return cache;
        }
        function saveCache(records) {
            const today = new Date().toISOString().split('T')[0];
            localStorage.setItem('pm_cache_date', today);
            localStorage.setItem('pm_cache_records', JSON.stringify(records));
        }

        // ============= ENVÍO DEL FORMULARIO =============
        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Obtener valores
            const cedulaTipo = document.getElementById('cedulaTipo').value;
            const cedulaNum = document.getElementById('cedulaNum').value.trim();
            const cedulaPagador = cedulaTipo + cedulaNum;

            const operadorPag = document.getElementById('operadorPagador').value;
            const telefonoPagNum = document.getElementById('telefonoPagador').value.trim();
            const telefonoPagador = operadorPag + telefonoPagNum;

            const operadorDes = document.getElementById('operadorDestino').value;
            const telefonoDesNum = document.getElementById('telefonoDestino').value.trim();
            const telefonoDestino = operadorDes + telefonoDesNum;

            const referencia = document.getElementById('referencia').value.trim();

            let fechaPago = document.getElementById('fechaPago').value;
            if (!fechaPago) {
                fechaPago = new Date().toISOString().split('T')[0];
            }

            const montoRaw = document.getElementById('montoInput').value.trim();
            // Convertir de formato "1.234,56" a "1234.56"
            const importe = montoRaw.replace(/\./g, '').replace(',', '.');

            const bancoOrigen = document.getElementById('bancoOrigen').value;

            // Validaciones básicas
            if (!cedulaNum || !telefonoPagNum || !telefonoDesNum || !referencia || !importe || !bancoOrigen) {
                showResult(false, "Datos incompletos", "Por favor complete todos los campos obligatorios.");
                return;
            }

            // Clave única para caché (opcional)
            const uniqueKey = `${cedulaPagador}_${telefonoPagador}_${telefonoDestino}_${referencia}_${fechaPago}_${importe}_${bancoOrigen}`;
            const cacheRecords = getDailyCache();
            if (cacheRecords.includes(uniqueKey)) {
                showResult(false, "Consulta Repetida", "Esta misma consulta ya fue realizada hoy. No se permite repetir.");
                return;
            }

            // Mostrar loading
            document.getElementById('loadingModal').classList.remove('hidden');

            try {
                // Construir el payload según la documentación
                const payload = {
                    cedulaPagador,
                    telefonoPagador,
                    telefonoDestino,
                    referencia,
                    fechaPago,
                    importe,
                    bancoOrigen
                };

                // Llamar a Cloudflare Worker (que redirigirá a BDV)
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // Ocultar loading
                document.getElementById('loadingModal').classList.add('hidden');

                // Guardar en caché
                cacheRecords.push(uniqueKey);
                saveCache(cacheRecords);

                // Interpretar la respuesta de BDV
                // Estructura esperada: { code, message, data, status }
                if (result.code === 1000) {
                    // Éxito
                    const montoMostrar = result.data?.amount || importe;
                    const mensaje = `Pago confirmado: Bs. ${montoMostrar} - ${result.message || 'Transacción realizada'}`;
                    showResult(true, "¡PAGO CONFIRMADO!", mensaje);
                } else {
                    // Cualquier otro code es error
                    const errorMsg = result.message || "No se encontró el pago o ocurrió un error.";
                    showResult(false, "PAGO NO ENCONTRADO", errorMsg);
                }

            } catch (error) {
                document.getElementById('loadingModal').classList.add('hidden');
                showResult(false, "Error de Conexión", "No se pudo conectar con el servidor. Intente nuevamente.");
            }
        });

        // ============= FUNCIÓN PARA MOSTRAR RESULTADO =============
        function showResult(success, title, message) {
            const container = document.getElementById('resultContainer');
            const cardBox = document.getElementById('resultCardBox');
            const icon = document.getElementById('resultIcon');
            const titleEl = document.getElementById('resultTitle');
            const msgEl = document.getElementById('resultMessage');

            container.classList.remove('hidden');

            if (success) {
                cardBox.className = "p-4 rounded-xl border border-emerald-500/50 bg-emerald-950/40 flex flex-col items-center shadow-inner animate-pop";
                icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]"></i>';
                titleEl.className = "text-xl font-extrabold tracking-wide text-emerald-400";
                msgEl.className = "text-sm mt-2 text-emerald-100 leading-relaxed";
            } else {
                cardBox.className = "p-4 rounded-xl border border-rose-500/50 bg-rose-950/40 flex flex-col items-center shadow-inner animate-pop";
                icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-400 drop-shadow-[0_0_10px_rgba(251,113,133,0.5)]"></i>';
                titleEl.className = "text-xl font-extrabold tracking-wide text-rose-400";
                msgEl.className = "text-sm mt-2 text-rose-100 leading-relaxed";
            }

            titleEl.textContent = title;
            msgEl.textContent = message;
        }

        // ============= RESET =============
        function resetForm() {
            document.getElementById('verifyForm').reset();
            document.getElementById('resultContainer').classList.add('hidden');
            // Restaurar fecha actual
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fechaPago').value = today;
        }
    </script>
</body>
</html>
